[workspace]
resolver = "3"
members = ["crates/*"]
# pixfx-gpui needs the local gpui fork at ../zed-gpui, and pixfx-bevy pulls in Bevy: each is its own workspace so
# the rest builds without them
exclude = ["crates/pixfx-gpui", "crates/pixfx-bevy"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
libm = "0.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde-wasm-bindgen = "=0.6.5"
serde_json = "=1.0.154"
serde_path_to_error = "=0.1.20"
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "=0.2.130"

# Frame time comes first: a download happens once, every frame of play pays for slow code, so opt-level stays 3.
# Fat LTO across crates in one codegen unit costs no speed and shrinks the 25-effect wasm (after wasm-pack's
# wasm-opt) to about 235 KB gzip. Games cut size further by building only the effects they play.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"
