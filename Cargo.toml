[workspace]
resolver = "3"
members = ["crates/*"]
# pixfx-gpui needs the local gpui fork at ../zed-gpui; it is its own workspace so the rest builds without it
exclude = ["crates/pixfx-gpui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
libm = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"
