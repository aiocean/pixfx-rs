# Transcendental float math goes through libm so native and wasm builds produce identical bits.
disallowed-methods = [
  { path = "f64::sin", reason = "use libm::sin" },
  { path = "f64::cos", reason = "use libm::cos" },
  { path = "f64::tan", reason = "use libm::tan" },
  { path = "f64::atan2", reason = "use libm::atan2" },
  { path = "f64::powf", reason = "use libm::pow" },
  { path = "f64::powi", reason = "use libm::pow" },
  { path = "f64::exp", reason = "use libm::exp" },
  { path = "f64::ln", reason = "use libm::log" },
  { path = "f64::sqrt", reason = "use libm::sqrt" },
  { path = "f64::hypot", reason = "use libm::hypot" },
  { path = "f64::floor", reason = "use libm::floor" },
  { path = "f64::ceil", reason = "use libm::ceil" },
  { path = "f64::round", reason = "use pixfx_core::math::js_round (JS Math.round)" },
]
