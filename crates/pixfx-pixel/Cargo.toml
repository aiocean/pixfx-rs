[package]
name = "pixfx-pixel"
description = "Agent tools for pixel art, pose sheets and effect references"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-core = { path = "../pixfx-core", features = ["body"] }
pixfx-draw = { path = "../pixfx-draw" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
# PNG for tests and example scripts only; the library itself does no I/O
pixfx-export = { path = "../pixfx-export" }
# a fighter look's named colours as a palette, for tests and example scripts
pixfx-fighter = { path = "../pixfx-fighter" }
# Effects for style references and GIF output for the reference scripts.
pixfx-effects = { path = "../pixfx-effects" }
gif = "=0.14.2"
