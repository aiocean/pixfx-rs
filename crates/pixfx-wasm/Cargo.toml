[package]
name = "pixfx-wasm"
description = "pixfx as a wasm engine driven from JavaScript: list effects, spawn instances, step them, read frames"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "=0.3.107"
pixfx-core = { path = "../pixfx-core", features = ["ts"] }
pixfx-effects = { path = "../pixfx-effects" }
serde.workspace = true
serde-wasm-bindgen.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true

[build-dependencies]
# the build script writes the EffectId union from the registry
pixfx-effects = { path = "../pixfx-effects" }

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
