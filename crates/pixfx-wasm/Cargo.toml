[package]
name = "pixfx-wasm"
description = "pixfx as a wasm engine driven from JavaScript: list effects, spawn instances, step them, read frames"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "=0.3.107"
pixfx-core = { path = "../pixfx-core", features = ["ts"] }
pixfx-draw = { path = "../pixfx-draw" }
pixfx-duel = { path = "../pixfx-duel", features = ["serde"], optional = true }
pixfx-effects = { path = "../pixfx-effects", default-features = false }
pixfx-export = { path = "../pixfx-export" }
pixfx-fighter = { path = "../pixfx-fighter", features = ["ts"], optional = true }
pixfx-light = { path = "../pixfx-light", features = ["ts"], optional = true }
pixfx-mind = { path = "../pixfx-mind", features = ["ts"], optional = true }
pixfx-scene = { path = "../pixfx-scene", features = ["ts"] }
serde.workspace = true
serde-wasm-bindgen.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true

[build-dependencies]
# the build script writes the EffectId union from the registry
pixfx-effects = { path = "../pixfx-effects", default-features = false }

[features]
default = ["all", "fighter", "light", "mind", "duel"]
# every effect. For fewer, build with --no-default-features and name the effects or categories of pixfx-effects:
# --features pixfx-effects/fire-candle,pixfx-effects/explosions (EffectId then lists only those)
all = ["pixfx-effects/all"]
# pixfx-fighter for JS: `Body`, `FightFeel`, `Sprites`, `lookColors`. A game without fighters builds without it.
fighter = ["dep:pixfx-fighter"]
# pixfx-light for JS: `stepLights`, `putOutLight`, `Lighting`. A game without scene light builds without it.
light = ["dep:pixfx-light"]
# pixfx-mind for JS: `Mind`, a fighter's brain. A game whose fighters a player alone drives builds without it.
mind = ["dep:pixfx-mind"]
# pixfx-duel for JS: `Duel`, the landing duel's rules, and the tables the page reads.
duel = ["dep:pixfx-duel", "dep:pixfx-mind"]

# wasm-pack's wasm-opt pass tuned for speed: -O3 runs effects 3 to 23% faster than its default -O (interleaved
# benchmark of all 25 effects) at the same size.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[lints]
workspace = true
