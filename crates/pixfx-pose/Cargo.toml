[package]
name = "pixfx-pose"
description = "Pose skeletons for image models: a body posed by joint angles, seen from any facing, drawn colour-coded per limb into a captioned sheet a model draws a character into"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-body = { path = "../pixfx-body" }
pixfx-draw = { path = "../pixfx-draw" }
pixfx-pixel = { path = "../pixfx-pixel" }
serde.workspace = true
serde_json = "=1.0.154"

[lints]
workspace = true

[dev-dependencies]
# PNG for the example script only; the library itself does no I/O
pixfx-export = { path = "../pixfx-export" }
