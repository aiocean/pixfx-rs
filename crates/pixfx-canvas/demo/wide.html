<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>pixfx-canvas demo: a world wider than the canvas</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0a0e; color: #c8c3d6; font: 14px ui-monospace, monospace; }
    canvas { width: min(1280px, 96vw); image-rendering: pixelated; cursor: crosshair; display: block; }
    p { margin: 12px 0 0; text-align: center; }
  </style>
</head>
<body>
  <main>
    <canvas id="stage"></canvas>
    <p id="status">loading…</p>
  </main>
  <script type="module" src="./wide.js"></script>
</body>
</html>
