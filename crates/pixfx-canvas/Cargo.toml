[package]
name = "pixfx-canvas"
description = "pixfx as a wasm renderer: mount it on a canvas, say which effects play where, and it runs the loop and draws"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "=0.3.107"
pixfx-core = { path = "../pixfx-core" }
pixfx-effects = { path = "../pixfx-effects" }
pixfx-fighter = { path = "../pixfx-fighter" }
pixfx-light = { path = "../pixfx-light" }
pixfx-wasm = { path = "../pixfx-wasm" }
wasm-bindgen = "=0.2.130"
web-sys = { version = "=0.3.107", features = [
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "ImageData",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "Window",
  "console",
] }

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"

[lints]
workspace = true
