[package]
name = "pixfx-canvas"
description = "pixfx as a wasm renderer: mount it on a canvas, say which effects play where, and it runs the loop and draws"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
js-sys = "=0.3.107"
pixfx-core = { path = "../pixfx-core", features = ["ts"] }
pixfx-draw = { path = "../pixfx-draw" }
pixfx-effects = { path = "../pixfx-effects", default-features = false }
pixfx-export = { path = "../pixfx-export" }
pixfx-fighter = { path = "../pixfx-fighter", features = ["ts"] }
pixfx-light = { path = "../pixfx-light", features = ["ts"] }
pixfx-wasm = { path = "../pixfx-wasm", default-features = false }
serde.workspace = true
tsify.workspace = true
wasm-bindgen.workspace = true
web-sys = { version = "=0.3.107", features = [
  "CanvasRenderingContext2d",
  "HtmlCanvasElement",
  "ImageData",
  "OffscreenCanvas",
  "OffscreenCanvasRenderingContext2d",
  "Window",
  "console",
] }

[features]
default = ["all"]
# every effect. For fewer, build with --no-default-features and name the effects or categories of pixfx-effects:
# --features pixfx-effects/fire-candle,pixfx-effects/explosions
all = ["pixfx-effects/all"]

# wasm-pack's wasm-opt pass tuned for speed: -O3 runs effects 3 to 23% faster than its default -O (interleaved
# benchmark of all 25 effects) at the same size.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3"]

[lints]
workspace = true
