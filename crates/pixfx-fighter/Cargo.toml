[package]
name = "pixfx-fighter"
description = "Pixel fighters for pixfx: a drawn fighter with its poses, a body that takes hits like a fighting game's, the screen's answer to a blow, and the marks that hang on a fighter"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-core = { path = "../pixfx-core" }
pixfx-draw = { path = "../pixfx-draw" }
serde = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
# serde for the value types, in the shapes JS passes them (camelCase, colours as "#rrggbb")
serde = ["dep:serde", "pixfx-core/serde"]
# TypeScript declarations for the value types, for the wasm bindings
ts = ["serde", "pixfx-core/ts", "dep:tsify", "dep:wasm-bindgen"]

[dev-dependencies]
# PNG for the example scripts
pixfx-export = { path = "../pixfx-export" }
serde_json.workspace = true

[lints]
workspace = true
