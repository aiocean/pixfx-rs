[package]
name = "pixfx-light"
description = "Scene light for pixfx: lights are values, pure functions age them and add them to a frame's light layer in hard-edged rings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-draw = { path = "../pixfx-draw" }
serde = { workspace = true, optional = true }
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
# serde for the value types, in the shapes JS passes them (camelCase, colours as "#rrggbb")
serde = ["dep:serde", "pixfx-draw/serde"]
# TypeScript declarations for the value types, for the wasm bindings
ts = ["serde", "pixfx-draw/ts", "dep:tsify", "dep:wasm-bindgen"]

[lints]
workspace = true
