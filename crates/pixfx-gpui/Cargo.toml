# Its own workspace: it needs the local gpui fork at ../../../zed-gpui, which the root workspace must build
# without. Check it with `cargo test --manifest-path crates/pixfx-gpui/Cargo.toml`.
[workspace]

[package]
name = "pixfx-gpui"
description = "Live pixfx effects in gpui: colour painted normally, light painted additively"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
gpui = { path = "../../../zed-gpui/crates/gpui", default-features = false }
image = { version = "=0.25.10", default-features = false }
pixfx-core = { path = "../pixfx-core" }
pixfx-draw = { path = "../pixfx-draw" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
disallowed_methods = "deny"

[dev-dependencies]
gpui = { path = "../../../zed-gpui/crates/gpui", default-features = false, features = ["test-support"] }
pixfx-effects = { path = "../pixfx-effects" }
