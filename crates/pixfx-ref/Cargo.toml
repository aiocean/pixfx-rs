[package]
name = "pixfx-ref"
description = "Effect references from an image model: a labelled template sheet and prompt from a spec, the OpenRouter request, and the effect's pixels cut back out as colour and light layers with a review page"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-draw = { path = "../pixfx-draw" }
pixfx-pixel = { path = "../pixfx-pixel" }
pixfx-pose = { path = "../pixfx-pose" }
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[dev-dependencies]
# PNG in and out, and a frame of an existing effect as the style reference, for the example scripts only; the
# library itself does no I/O
pixfx-core = { path = "../pixfx-core" }
pixfx-effects = { path = "../pixfx-effects" }
pixfx-export = { path = "../pixfx-export" }
# the whole effect as a gif (`whole` script)
gif = "=0.14.2"
