[package]
name = "pixfx-cli"
description = "pixfx command line: checks ported effects against pixelfx reference renders"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pixfx"
path = "src/main.rs"

[dependencies]
gif = "=0.14.2"
pixfx-core = { path = "../pixfx-core" }
pixfx-draw = { path = "../pixfx-draw" }
pixfx-effects = { path = "../pixfx-effects" }
pixfx-export = { path = "../pixfx-export" }
pixfx-fighter = { path = "../pixfx-fighter" }

[lints]
workspace = true
