[package]
name = "pixfx-effects"
description = "Pixel-art effects ported from pixelfx, as pixfx-core effects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-core = { path = "../pixfx-core" }

[features]
default = ["all"]
# every effect; a game that needs a few builds with default-features = false and names them
all = ["arcane", "critters", "explosions", "fire", "holy", "ice", "impacts", "lightning", "nature", "pickups", "projectiles", "scifi", "shadow", "spawn", "transitions", "water", "weather"]
# a category: every effect in it
arcane = ["arcane-rune-circle"]
critters = ["critters-wisp"]
explosions = ["explosions-dirt-explosion", "explosions-implosion", "explosions-plasma-explosion", "explosions-small-explosion"]
fire = ["fire-brazier", "fire-campfire", "fire-candle", "fire-spirit-flame"]
holy = ["holy-feather-burst"]
ice = ["ice-icicle-fall"]
impacts = ["impacts-parry"]
lightning = ["lightning-ball-lightning"]
nature = ["nature-poison-cloud"]
pickups = ["pickups-coin-spin"]
projectiles = ["projectiles-laser-bolt"]
scifi = ["scifi-jetpack"]
shadow = ["shadow-void-orb"]
spawn = ["spawn-poof"]
transitions = ["transitions-burn-away", "transitions-crt-off"]
water = ["water-water-jet"]
weather = ["weather-fireflies", "weather-snow"]
# one effect each, named after its id with the / as - (fire/candle is fire-candle)
arcane-rune-circle = []
critters-wisp = []
explosions-dirt-explosion = []
explosions-implosion = []
explosions-plasma-explosion = []
explosions-small-explosion = []
fire-brazier = []
fire-campfire = []
fire-candle = []
fire-spirit-flame = []
holy-feather-burst = []
ice-icicle-fall = []
impacts-parry = []
lightning-ball-lightning = []
nature-poison-cloud = []
pickups-coin-spin = []
projectiles-laser-bolt = []
scifi-jetpack = []
shadow-void-orb = []
spawn-poof = []
transitions-burn-away = []
transitions-crt-off = []
water-water-jet = []
weather-fireflies = []
weather-snow = []

[lints]
workspace = true

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"
serde_json = "=1.0.154"
