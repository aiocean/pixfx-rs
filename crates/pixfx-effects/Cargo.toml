[package]
name = "pixfx-effects"
description = "Pixel-art effects that read the sprite they play on or the way it moved, as pixfx-core effects"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-core = { path = "../pixfx-core" }
pixfx-draw = { path = "../pixfx-draw" }

[features]
default = ["all"]
# every effect; a game that needs a few builds with default-features = false and names them
all = ["appear", "disappear", "explosions", "feedback", "projectiles"]
# a category: every effect in it
appear = ["appear-dither", "appear-teleport-beam"]
disappear = ["disappear-blink-out", "disappear-dither", "disappear-fade", "disappear-incinerate"]
explosions = ["explosions-body-burst"]
feedback = ["feedback-cloak-shimmer", "feedback-electrified", "feedback-encase", "feedback-outline", "feedback-power-up", "feedback-soaked"]
projectiles = ["projectiles-trail"]
# one effect each, named after its id with the / as - (feedback/outline is feedback-outline)
appear-dither = []
appear-teleport-beam = []
disappear-blink-out = []
disappear-dither = []
disappear-fade = []
disappear-incinerate = []
explosions-body-burst = []
feedback-cloak-shimmer = []
feedback-electrified = []
feedback-encase = []
feedback-outline = []
feedback-power-up = []
feedback-soaked = []
projectiles-trail = []

[lints]
workspace = true

# the bench script carries its own tests
[[example]]
name = "bench"
test = true

# Tests about named effects run when those effects are built, so one effect builds and tests alone:
# `cargo test -p pixfx-effects --no-default-features --features feedback-outline`.
[[test]]
name = "features"
required-features = ["all"]

[[test]]
name = "body_burst"
required-features = ["explosions-body-burst"]

[dev-dependencies]
wasm-bindgen-test = "=0.3.80"
# preserve_order: the goldens keep their order when blessed
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
