[package]
name = "pixfx-effects"
description = "Painted, sprite-based and hybrid pixel-art effects for pixfx-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libm.workspace = true
pixfx-core = { path = "../pixfx-core" }
pixfx-draw = { path = "../pixfx-draw" }

[features]
default = ["all"]
# every effect; a game that needs a few builds with default-features = false and names them
all = ["appear", "critters", "disappear", "explosions", "feedback", "impacts", "melee", "projectiles", "slashes", "spawn", "transitions", "water", "fire", "lightning", "ice"]
# a category: every effect in it
appear = ["appear-dither", "appear-fade", "appear-teleport-beam"]
critters = ["critters-wisp"]
disappear = ["disappear-blink-out", "disappear-dither", "disappear-fade", "disappear-incinerate"]
explosions = ["explosions-body-burst"]
fire = ["fire-brazier", "fire-campfire", "fire-candle", "fire-fire-breath", "fire-fire-ring", "fire-fire-tornado", "fire-fireball", "fire-flame-pillar", "fire-flamethrower", "fire-meteor", "fire-spirit-flame", "fire-torch"]
feedback = ["feedback-afterimage", "feedback-amber-ward", "feedback-arc-link", "feedback-burning", "feedback-cloak-shimmer", "feedback-comet-weave", "feedback-electrified", "feedback-elemental-charge", "feedback-encase", "feedback-foot-contact", "feedback-frozen", "feedback-hit-flash", "feedback-mask-ignition", "feedback-occlusion", "feedback-outline", "feedback-petrified", "feedback-poisoned", "feedback-power-up", "feedback-ricochet", "feedback-rim-light", "feedback-shield-absorb", "feedback-shield-crack", "feedback-soaked", "feedback-sprite-shatter", "feedback-telegraph", "feedback-violet-portal", "feedback-volt-orbit"]
ice = ["ice-blizzard-vortex", "ice-freeze", "ice-frost-breath", "ice-frost-nova", "ice-ice-crystal", "ice-ice-lance", "ice-ice-shatter", "ice-ice-spikes", "ice-icicle-fall", "ice-snowflake-burst"]
impacts = ["impacts-aftershock", "impacts-charged-pulse", "impacts-contact-pulse", "impacts-directional-wave", "impacts-parry", "impacts-resonance", "impacts-rune-flash", "impacts-thunderstrike"]
lightning = ["lightning-ball-lightning", "lightning-chain-lightning", "lightning-charge-up", "lightning-electrified", "lightning-lightning-strike", "lightning-plasma-ball", "lightning-spark-arc", "lightning-storm-cloud", "lightning-tesla-coil", "lightning-thunderclap", "lightning-zap-hit"]
melee = ["melee-sword-slash"]
projectiles = ["projectiles-aether-pierce", "projectiles-arcane-meteor", "projectiles-corkscrew", "projectiles-moon-windblade", "projectiles-pulse-rings", "projectiles-trail", "projectiles-twin-sparks", "projectiles-violet-wake"]
slashes = ["slashes-slash-1", "slashes-slash-2", "slashes-slash-3"]
spawn = ["spawn-poof"]
transitions = ["transitions-burn-away"]
water = ["water-bubbles", "water-drip", "water-fountain", "water-geyser", "water-rain-splash", "water-ripples", "water-splash", "water-water-jet", "water-water-orb", "water-waterfall", "water-wave-crash", "water-whirlpool"]
# one effect each, named after its id with the / as - (feedback/outline is feedback-outline)
ice-blizzard-vortex = []
ice-freeze = []
